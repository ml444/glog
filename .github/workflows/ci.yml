name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        go-version: ["1.21.x", "1.23.x"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}

      - name: Root module
        run: |
          go vet ./...
          go test ./... -race -count=1

      - name: Tests submodule
        working-directory: tests
        run: |
          go vet ./...
          go test ./... -race -count=1

  windows-compatibility:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.x"
      - name: Ordinary logging and unsupported durable requests
        run: go test ./... -count=1
      - name: Tests submodule
        working-directory: tests
        run: go test ./... -count=1
